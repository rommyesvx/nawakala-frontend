<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalender - Nawakala</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link href="assets/bootstrap/bootstrap-5.0.2-dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    
    <!-- top navbar (desktop)-->
    <div id="navbar-desktop-container"></div>

    <main class="main-content pt-4">
        <div id="viewCalendar" class="container content-container animate-fade-in">
            <h5 class="fw-bold mb-3">Kalender Kerja</h5>
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white mb-3">
                <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
                    <button class="btn btn-light rounded-circle shadow-sm text-primary" onclick="changeMonth(-1)"><i class="fas fa-chevron-left"></i></button>
                    <h6 class="fw-bold m-0 text-primary" id="calendarTitle">...</h6>
                    <button class="btn btn-light rounded-circle shadow-sm text-primary" onclick="changeMonth(1)"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="card-body p-3">
                    <div class="d-grid text-center mb-2" style="grid-template-columns: repeat(7, 1fr);">
                        <span class="text-muted small fw-bold text-danger">Min</span>
                        <span class="text-muted small fw-bold">Sen</span>
                        <span class="text-muted small fw-bold">Sel</span>
                        <span class="text-muted small fw-bold">Rab</span>
                        <span class="text-muted small fw-bold">Kam</span>
                        <span class="text-muted small fw-bold">Jum</span>
                        <span class="text-muted small fw-bold text-danger">Sab</span>
                    </div>
                    <div id="calendarGrid" class="d-grid text-center" style="grid-template-columns: repeat(7, 1fr); gap: 8px;"></div>
                </div>
            </div>
            <div id="holidayList" class="d-flex flex-column gap-2 pb-5"></div>
        </div>
    </main>

    <div id="logoutModal" class="custom-modal-overlay d-none">
        <div class="custom-modal-box text-center">
            <div class="modal-icon-wrapper" style="background: #fee2e2; color: #ef4444;"><i class="fas fa-power-off"></i></div>
            <h5 class="fw-bold mt-3">Konfirmasi</h5>
            <p class="text-muted small mb-4">Apakah Anda yakin ingin keluar?</p>
            <div class="d-flex gap-2 justify-content-center">
                <button onclick="closeLogoutModal()" class="btn btn-light w-50 rounded-pill fw-bold text-secondary">Batal</button>
                <button onclick="confirmLogout()" class="btn btn-danger w-50 rounded-pill fw-bold shadow-sm">Ya, Keluar</button>
            </div>
        </div>
    </div>

    <div id="appModal" class="custom-modal-overlay d-none">
        <div class="custom-modal-box text-center">
            <div class="modal-icon-wrapper" id="modalIconBg"><i class="fas fa-info" id="modalIcon"></i></div>
            <h5 id="modalTitle" class="fw-bold mt-3">Info</h5>
            <p id="modalMessage" class="text-muted small mb-4">...</p>
            <button onclick="closeAppModal()" class="btn btn-primary w-100 rounded-pill">Oke</button>
        </div>
    </div>

    <div id="navbar-mobile-container"></div>
    
    <script src="cordova.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/navbar.js?v=1.0.1"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/login.js"></script>
    <script src="assets/js/presensi.js"></script>
    <script src="assets/js/calendar.js"></script>
    <script src="assets/js/profile.js"></script>
    <script src="assets/js/patrol.js"></script>
    <script src="assets/js/script.js?v=1.1"></script>
</body>
</html>
