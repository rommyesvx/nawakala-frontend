<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Riwayat - Nawakala</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link href="assets/bootstrap/bootstrap-5.0.2-dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    
    <div id="navbar-desktop-container"></div>

    <main class="main-content pt-4">
        <div class="container content-container animate-fade-in">
            <h5 class="fw-bold mb-3">Data Presensi</h5>
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" style="width: 100%;">
                            <thead class="bg-light text-muted small">
                                <tr>
                                    <th class="ps-4 py-3">TANGGAL</th>
                                    <th class="ps-2 py-3">STATUS</th>
                                    <th class="ps-2 py-3">MASUK</th>
                                    <th class="ps-2 py-3">KELUAR</th>
                                </tr>
                            </thead>
                            <tbody id="fullHistoryList">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="logoutModal" class="custom-modal-overlay d-none">
        <div class="custom-modal-box text-center">
            <div class="modal-icon-wrapper" style="background: #fee2e2; color: #ef4444;"><i class="fas fa-power-off"></i></div>
            <h5 class="fw-bold mt-3">Konfirmasi</h5>
            <p class="text-muted small mb-4">Apakah Anda yakin ingin keluar?</p>
            <div class="d-flex gap-2 justify-content-center">
                <button onclick="closeLogoutModal()" class="btn btn-light w-50 rounded-pill fw-bold text-secondary">Batal</button>
                <button onclick="confirmLogout()" class="btn btn-danger w-50 rounded-pill fw-bold shadow-sm">Ya, Keluar</button>
            </div>
        </div>
    </div>

    <div id="appModal" class="custom-modal-overlay d-none">
        <div class="custom-modal-box text-center">
            <div class="modal-icon-wrapper" id="modalIconBg"><i class="fas fa-check" id="modalIcon"></i></div>
            <h5 id="modalTitle" class="fw-bold mt-3">Info</h5>
            <p id="modalMessage" class="text-muted small mb-4">...</p>
            <button onclick="closeAppModal()" class="btn btn-primary w-100 rounded-pill">Oke</button>
        </div>
    </div>
    <div id="navbar-mobile-container"></div>
    
    <script src="cordova.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/navbar.js?v=1.0.1"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/login.js"></script>
    <script src="assets/js/presensi.js"></script>
    <script src="assets/js/calendar.js"></script>
    <script src="assets/js/profile.js"></script>
    <script src="assets/js/patrol.js"></script>  
    <script src="assets/js/script.js"></script>  
</body>
</html>
